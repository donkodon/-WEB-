  #       with:
  #         node-version: '20'
  #         cache: 'npm'
  #     - run: npm ci
  #     - run: npm run test

  # ─────────────────────────────────────────────
  # Job 3: Build（ビルド確認）← 今すぐ有効
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: Deploy to Cloudflare Pages（mainブランチのみ）
  # CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を
  # GitHub Secrets に登録したら有効化する
