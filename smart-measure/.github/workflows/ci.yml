  #         node-version: '20'
  #         cache: 'npm'
  #     - run: npm ci
  #     - run: npm run build
  #     - name: Deploy
  #       run: npx wrangler pages deploy dist --project-name smart-measure --commit-message "CI deploy"
  #       env:
  #         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  #         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

