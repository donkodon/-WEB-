  #         node-version: '20'
  #         cache: 'npm'
  #     - run: npm ci
  #     - run: npm run lint

  # ─────────────────────────────────────────────
  # Job 2: Unit Test（単体テスト）
  # Step3でVitestを導入したら有効化する
  # ─────────────────────────────────────────────
  # test:
  #   name: Unit Test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
